# Perfil de TESTE: banco H2 em memoria e dados sinteticos. Nenhuma credencial real.
spring.datasource.url=jdbc:h2:mem:friovale;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Chave HMAC sintetica, usada apenas nos testes (>= 32 caracteres)
friovale.jwt.secret=chave-sintetica-de-teste-0123456789abcdef

# Sem gestor automatico: os testes criam os proprios usuarios sinteticos
friovale.bootstrap.admin-password=

# Desliga integracoes externas durante os testes
friovale.ia.enabled=false
friovale.ia.api-url=http://127.0.0.1:9
friovale.thingspeak.base-url=http://127.0.0.1:9
friovale.thingspeak.poll-rate-ms=86400000
friovale.thingspeak.log-sync-initial-delay-ms=86400000
friovale.ia.reprocess-initial-delay-ms=86400000
brevo.api.key=

# [Seguranca] chave AES sintetica SOMENTE para testes (32 bytes em Base64)
friovale.otp.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
friovale.security.mission-code=${MISSION_CODE:CODIGO_MISSAO}
