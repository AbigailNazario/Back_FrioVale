spring.application.name=frioVale

# Mostra o SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Atualiza as tabelas quando as entidades mudam
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Banco de dados
spring.datasource.url=
spring.datasource.username=root
spring.datasource.password=

# FrioVale
friovale.timezone=America/Recife
friovale.cors.allowed-origins=*
friovale.thingspeak.base-url=https://api.thingspeak.com
friovale.thingspeak.poll-rate-ms=15000
friovale.thingspeak.log-sync-rate-ms=300000
friovale.thingspeak.log-sync-initial-delay-ms=30000
friovale.thingspeak.connect-timeout=3s
friovale.thingspeak.read-timeout=5s

friovale.jwt.secret=
friovale.jwt.expiration-minutes=720

friovale.bootstrap.admin-name=Gestor
friovale.bootstrap.admin-email=gestor@friovale.com
friovale.bootstrap.admin-password=TroqueEstaSenha123

# Envio de e-mail via API REST do Brevo 
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FrioVale}

# API de IA (FastAPI Python)
friovale.ia.api-url=http://localhost:8000
friovale.ia.connect-timeout=3s
friovale.ia.read-timeout=5s
friovale.ia.enabled=true

# Acelerometro / impactos
friovale.impact.alert-enabled=true
friovale.impact.threshold-g=2.0
friovale.impact.stale-after-minutes=2