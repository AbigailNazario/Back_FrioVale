spring.application.name=frioVale

# Mostra o SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Atualiza as tabelas quando as entidades mudam
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Banco de dados
spring.datasource.url=
spring.datasource.username=root
spring.datasource.password=

# Canal ADICIONAL de eventos individuais do acelerometro (field1=800, field5=pico em g).
# A sincronizacao principal (field1/2/3/4/5 do container) NAO e alterada.
friovale.thingspeak.impact-events.channel-id=${THINGSPEAK_EVENT_CHANNEL_ID:}
friovale.thingspeak.impact-events.api-key=${THINGSPEAK_EVENT_API_KEY:}

# FrioVale
friovale.timezone=America/Recife
friovale.cors.allowed-origins=*
friovale.thingspeak.base-url=https://api.thingspeak.com
friovale.thingspeak.poll-rate-ms=15000
friovale.thingspeak.log-sync-rate-ms=300000
friovale.thingspeak.log-sync-initial-delay-ms=30000
friovale.thingspeak.connect-timeout=3s
friovale.thingspeak.read-timeout=5s

friovale.jwt.secret=
friovale.jwt.expiration-minutes=720

friovale.bootstrap.admin-name=Gestor
friovale.bootstrap.admin-email=gestor@friovale.com
friovale.bootstrap.admin-password=

# Envio de e-mail via API REST do Brevo (OkHttp; funciona no Render, SMTP eh bloqueado)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FrioVale}

# API de IA (FastAPI Python)
friovale.ia.api-url=http://localhost:8000
friovale.ia.connect-timeout=3s
friovale.ia.read-timeout=5s
friovale.ia.enabled=true

# Acelerometro / impactos
friovale.impact.alert-enabled=true
friovale.impact.threshold-g=2.0
friovale.impact.stale-after-minutes=2


# ============================================================
# [Seguranca] Projeto Final de Seguranca da Informacao
# ============================================================

# Codigo de missao enviado pelo professor (6 caracteres). Aparece nos logs de bloqueio.
# Substitua CODIGO_MISSAO pelo codigo oficial ou defina a variavel de ambiente MISSION_CODE.
friovale.security.mission-code=${MISSION_CODE:CODIGO_MISSAO}

# [Seguranca - 2FA] TOTP (RFC 6238), compativel com Google/Microsoft Authenticator e Authy
friovale.otp.issuer=FrioVale
friovale.otp.period-seconds=30
friovale.otp.digits=6
# Tolerancia de relogio em passos de 30 s (1 = aceita o codigo anterior e o seguinte). 0 = so o atual.
friovale.otp.allowed-discrepancy=1
# Chave AES-256 (32 bytes em Base64) que cifra o segredo TOTP no banco. NUNCA versionar o valor.
# Sem ela a aplicacao NAO sobe (falha segura).
friovale.otp.encryption-key=${FRIOVALE_OTP_ENCRYPTION_KEY:}
# Erros seguidos no 2o fator antes do bloqueio temporario
friovale.otp.max-attempts=5
friovale.otp.lock-minutes=5
# Validade do token intermediario (entre a senha e o codigo)
friovale.otp.mfa-token-minutes=5
friovale.otp.recovery-code-count=10
