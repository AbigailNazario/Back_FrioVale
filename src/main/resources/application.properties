spring.application.name=frioVale

# Mostra o SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Atualiza as tabelas quando as entidades mudam
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Banco de dados
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/frioVale?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# FrioVale
friovale.timezone=America/Recife
friovale.cors.allowed-origins=*
friovale.thingspeak.base-url=https://api.thingspeak.com
friovale.thingspeak.poll-rate-ms=15000
friovale.thingspeak.connect-timeout=3s
friovale.thingspeak.read-timeout=5s

